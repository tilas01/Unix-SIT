name: Deploy Website to GitHub Pages

on:
  # Deploy directly when the site changes on main. The workflow_run chain below
  # already covers the normal case, but it depends on "Release Security Tools"
  # completing first; this makes a website-only change deploy even if the Rust
  # release job fails.
  push:
    branches: ["main"]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'img/**'
      - '.github/workflows/pages.yml'
  # Still redeploy after a release, so the static release assets are refreshed.
  workflow_run:
    workflows: ["Release Security Tools"]
    types:
      - completed
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Website Assets
        run: |
          # website/docs holds the comprehensive copies, so -n (no-clobber)
          # keeps them and only fills in anything missing from the root docs.
          mkdir -p website/docs
          cp -rn docs/* website/docs/ 2>/dev/null || true
          cp -rn img website/ 2>/dev/null || true

      - name: Verify the site is intact before publishing
        run: |
          set -euo pipefail
          # The welcome dialog will not let anyone past without ticking two
          # boxes that link to these. Publishing the site without them means
          # every visitor is asked to agree to a 404.
          for doc in LEGAL-WAIVER.txt LICENSE.txt LICENCE-PLAIN-ENGLISH.txt; do
            test -s "website/user-agreements/$doc" \
              || { echo "FATAL: website/user-agreements/$doc is missing or empty"; exit 1; }
          done
          # That LICENSE.txt is a copy, so the site can serve the licence as
          # plain text from its own deployment. A copy that has drifted from the
          # real one is worse than no copy: people would be ticking a box to
          # agree to terms that are not the repository's terms.
          diff -q LICENSE website/user-agreements/LICENSE.txt \
            || { echo "FATAL: website/user-agreements/LICENSE.txt has drifted from LICENSE"; exit 1; }
          cd website
          # Every page the nav links to must exist, or we publish 404s.
          for page in index.html site-index.html manual.html wiki.html \
                      iso-verify.html live.html security-tools.html \
                      releases.html repo.html \
                      style.css script.js tooltip.js legal.js shared-ui.js \
                      manual-data.js manual-guide.js manual.js \
                      iso-verify.js site-index.js search-index.json; do
            test -f "$page" || { echo "FATAL: website/$page is missing"; exit 1; }
          done
          # A SyntaxError in a classic <script> stops the whole file executing,
          # which is exactly how this site shipped broken for 12 commits. Refuse
          # to publish one. Every script, not a hand-maintained list that new
          # files get forgotten from.
          for js in *.js; do
            node --check "$js" || { echo "FATAL: $js does not parse"; exit 1; }
          done
          # The search index is generated; a malformed one silently disables
          # search on the page the site tells people to start from.
          node -e "
            const d = require('./search-index.json');
            if (!Array.isArray(d) || d.length < 100) {
              throw new Error('search-index.json has ' + (d.length ?? '?') + ' entries');
            }
            for (const e of d) {
              if (!e.t || !e.u) throw new Error('index entry missing t or u: ' + JSON.stringify(e));
            }
            console.log('search index: ' + d.length + ' entries');
          "
          echo "Pre-publish checks passed."

      # node --check catches a file that cannot parse. It says nothing about a
      # file that parses and produces the wrong thing, which is the layer these
      # catch: 578 permutations of the walkthrough asserted on content, every
      # generated script through `bash -n`, structural responsive checks, and
      # html-validate on every page.
      #
      # Each gate below gets its own step so a failure names itself in the job
      # summary. The list must stay in step with `npm test` in tests/package.json
      # — a gate that exists and is never run reports success it never earned.
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
        working-directory: tests

      # Run separately rather than through `npm test`, so a failure names itself
      # in the job summary instead of showing up as "npm test exited 1".
      - name: "Test: 578 generator permutations"
        run: npm run permutations
        working-directory: tests

      - name: "Test: responsive structure"
        run: npm run responsive
        working-directory: tests

      # The two front ends are separate tools that share a config format. This
      # asserts a config from either actually configures the other, and that the
      # mapping never invents an answer or guesses a destructive setting.
      - name: "Test: config translation between generators"
        run: npm run translate
        working-directory: tests

      # Five deliberately different installs end to end: coherent guide, script
      # bash accepts, and the Arch Wiki's canonical command order.
      - name: "Test: five install guides"
        run: npm run parity
        working-directory: tests

      # Every right-click-to-wiki target must resolve. Two handlers used to
      # build anchors by slugifying a control's label; none of the 54 slugs
      # matched a real id, so right-click silently went nowhere useful.
      - name: "Test: wiki right-click targets"
        run: npm run wiki
        working-directory: tests

      # Clicks the walkthrough through in jsdom with Dusky selected. The
      # permutation harness drives the data model directly, so it proved the
      # output was right while the page itself dead-ended: every option on a
      # locked question was disabled and choice questions advance only by
      # clicking one, leaving "← Back" as the only live control.
      - name: "Test: Dusky is installable in both front ends"
        run: npm run dusky
        working-directory: tests

      # The welcome dialog is a gate: Continue must be genuinely inert until
      # both boxes are ticked, and every document it asks people to agree to
      # must exist and match the repository licence.
      - name: "Test: welcome dialog gate and user agreements"
        run: npm run legal
        working-directory: tests

      # Emoji use has to be all-or-nothing within a list or card group. A
      # section where four items carry an icon and three do not reads as an
      # unfinished job rather than a design.
      - name: "Test: emoji consistency within groups"
        run: npm run emoji
        working-directory: tests

      # No hyperlink may land the reader on a raw .md file, the shared markdown
      # renderer must not build a live element out of a fetched document, and
      # every ?page= / ?sheet= target must resolve.
      - name: "Test: markdown rendering and no raw-markdown links"
        run: npm run markdown
        working-directory: tests

      # Every colour comes from the Tokyo Night palette, and no page redefines a
      # palette variable to a different value. wiki.html used to redefine
      # --border-color, so the same element was one colour there and another
      # everywhere else.
      - name: "Test: colour palette parity"
        run: npm run palette
        working-directory: tests

      # The Live Editor's preview button, asserted on behaviour rather than on
      # markup. index.html and live.html both called window.renderMarkdown while
      # loading no markdown.js; the calls are guarded, so the preview switched
      # panes and rendered nothing, in total silence.
      - name: "Test: Live Editor preview"
        run: npm run live
        working-directory: tests

      # Every page over real HTTP with every script actually executing. This
      # previously used JSDOM.fromFile against a dead http:// URL, so no script
      # loaded and a page running nothing reported "no runtime errors".
      - name: "Test: page runtime"
        run: npm run runtime
        working-directory: tests

      # A documented CLI flag no crate handles is this repository's most
      # persistent defect: ten of them shipped at once, and one meant the
      # boot-time OTP prompt was never installed on any machine.
      - name: "Test: documented tool flags exist"
        run: npm run cliflags
        working-directory: tests

      # Every <select> option must be reachable and must mean something to the
      # emitter. A control offering a value nothing reads is a phantom feature
      # wearing a dropdown.
      - name: "Test: select options are wired up"
        run: npm run selects
        working-directory: tests

      # Fails if a system exists in os-meta.js that this gate does not cover, so
      # adding a system cannot leave it untested while the gate still passes.
      - name: "Test: per-system variants"
        run: npm run osvariants
        working-directory: tests

      # The leakage measure: how often a guide prints another system's tooling
      # under this system's name. It reports while a system is badged and fails
      # the moment one is marked complete, so a badge cannot lift quietly.
      - name: "Test: no foreign tooling per system"
        run: npm run osperms
        working-directory: tests

      # The same leakage question aimed at the generator. os-permutations drives
      # the walkthrough's emitter; this drives index.html itself, over HTTP with
      # its scripts running, because the generator is DOM-bound and has no
      # callable entry point. Without it the headline number described one of
      # two front ends while being read as both.
      - name: "Test: no foreign tooling in the generator"
        run: npm run genos
        working-directory: tests

      # The generator must not refuse to generate over a question it has itself
      # withdrawn. Choosing "all the wallpapers" greys out the count and the
      # split, and the required-field sweep went on demanding both, outlining
      # two dropdowns that cannot be opened. jsdom does no layout, so this whole
      # validation path was unreachable by every other gate.
      - name: "Test: the generator never demands an unreachable answer"
        run: npm run genvalid
        working-directory: tests

      # A package name missing from a system's table does not fail loudly: it
      # falls through and reaches the reader as the Arch spelling inside an
      # otherwise correct command. No leakage count sees that, because the tool
      # is right and only the argument is wrong.
      - name: "Test: every system renames the same packages"
        run: npm run pkgnames
        working-directory: tests

      # The search may narrow to the selected system and must never lose a
      # shared entry doing it. The rule is subtractive - hide what belongs to
      # another system - because keeping only what matches would hide the whole
      # shared body of the site from every reader who picked anything.
      - name: "Test: scoping the search hides nothing shared"
        run: npm run searchscope
        working-directory: tests

      # The two front ends must offer the same applications, and one tick must
      # mean the same packages on both. They had drifted to 34 against 13, with
      # the same id meaning different packages on each side.
      - name: "Test: both front ends offer the same applications"
        run: npm run appparity
        working-directory: tests

      # Two programs that do the same job are allowed and are said out loud,
      # with what actually separates them, in all three places that mention it.
      - name: "Test: overlapping applications are explained consistently"
        run: npm run appoverlap
        working-directory: tests

      # Retired names must stay retired. anti-ducky's rename half-reverted once
      # and left a journalctl line naming a unit that never existed.
      - name: "Test: naming parity"
        run: npm run names
        working-directory: tests

      # The security-tool support table in the website and the one in the
      # installer are two copies of the same claim; this compares them in both
      # directions and requires a reason for anything that is not a plain yes.
      - name: "Test: per-system tool support"
        run: npm run toolsupport
        working-directory: tests

      # The emitted install scripts, linted rather than merely parsed. The
      # permutation gates already run every script through `bash -n`, which
      # proves the file parses and nothing more — an unquoted path that
      # word-splits, or a `cd` whose failure is ignored before an `rm -rf`,
      # parses perfectly. These scripts are the product, so they are held to
      # the same standard as source.
      #
      # ubuntu-latest ships shellcheck. The gate treats a missing one as a
      # failure when CI is set, rather than skipping: a gate that quietly does
      # not run reads as a pass.
      # Every `unsafe` block carries a SAFETY: comment naming the invariant, and
      # `overflow-checks` stays on in release. Neither needs a Rust toolchain —
      # it reads the crates' own sources and manifests — so it belongs here
      # rather than in the release workflow, where it would only run when
      # something is being published.
      - name: "Test: unsafe is accounted for, overflow checks stay on"
        run: npm run rustsafety
        working-directory: tests

      - name: Install shellcheck
        run: sudo apt-get install -y --no-install-recommends shellcheck

      - name: "Test: emitted scripts pass shellcheck"
        run: npm run shellcheck
        working-directory: tests

      # Characters nobody typed: byte-order marks, zero-width spaces, a
      # non-breaking space inside a command, UTF-16, and the mojibake a UTF-8
      # round trip through Latin-1 leaves behind. Each of these is invisible in
      # an editor and breaks something at a distance.
      - name: "Test: no stray characters"
        run: npm run stray
        working-directory: tests

      - name: "Test: HTML validity"
        run: npm run html
        working-directory: tests

      - name: Download Static Latest Release
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: security-tools-all
          path: './website/static-releases'
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
